<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1307"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>
  </defs>

  <!-- Instrument panel -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="#46381f" stroke-width="4"/>

  <g filter="url(#glow)">
    <!-- faint outer ring (richness at large sizes, fades out small) -->
    <circle cx="256" cy="256" r="186" fill="none" stroke="#ffb22e" stroke-width="10" opacity="0.28"/>
    <!-- bold signal ring -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="#ffb22e" stroke-width="34" opacity="0.92"/>
    <!-- transmitter core -->
    <circle cx="256" cy="256" r="58" fill="#ffce6a"/>
  </g>
</svg>
